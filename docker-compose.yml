x-amazon-scraper: &amazon-scraper
  image: amazon-scraper
  build: .
  restart: unless-stopped
  env_file: .env
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  amazon-pdp:
    <<: *amazon-scraper
    deploy:
      replicas: ${PDP_COUNT:?set PDP_COUNT in .env}
    environment:
      NODE_OPTIONS: --max-old-space-size=1024
      name: amazon-pdp
  amazon-plp:
    <<: *amazon-scraper
    deploy:
      replicas: ${PLP_COUNT:?set PLP_COUNT in .env}
    command: ["-t", "plp"]
    environment:
      NODE_OPTIONS: --max-old-space-size=1024
      name: amazon-plp
