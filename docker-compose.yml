x-pdp: &pdp
  image: amazon-scraper
  build: .
  restart: unless-stopped
  env_file: .env
  extra_hosts:
    - "host.docker.internal:host-gateway"
  command: ["-c", "5000", "-l", "10000", "-r", "200"]
  environment: &pdp-env
    NODE_OPTIONS: --max-old-space-size=32768

services:
  pdp-1:
    <<: *pdp
    environment:
      <<: *pdp-env
      name: pdp-1
  plp-1:
    image: amazon-scraper
    build: .
    restart: unless-stopped
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["-c", "1000", "-l", "500", "-r", "1", "-t", "plp"]
    environment:
      NODE_OPTIONS: --max-old-space-size=8192
      name: plp-1
