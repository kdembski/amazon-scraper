x-amazon-pdp: &amazon-pdp
  image: amazon-scraper
  build: .
  restart: unless-stopped
  env_file: .env
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  amazon-pdp-1:
    <<: *amazon-pdp
    environment:
      NODE_OPTIONS: --max-old-space-size=8192
      name: amazon-pdp-1
  amazon-pdp-2:
    <<: *amazon-pdp
    environment:
      NODE_OPTIONS: --max-old-space-size=8192
      name: amazon-pdp-2
  amazon-pdp-3:
    <<: *amazon-pdp
    environment:
      NODE_OPTIONS: --max-old-space-size=8192
      name: amazon-pdp-3
  amazon-plp:
    image: amazon-scraper
    build: .
    restart: unless-stopped
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["-t", "plp"]
    environment:
      NODE_OPTIONS: --max-old-space-size=8192
      name: amazon-plp
