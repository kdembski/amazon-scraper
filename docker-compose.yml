services:
  amazon-pdp:
    image: amazon-scraper
    build: .
    restart: unless-stopped
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["-c", "5000", "-l", "1000", "-r", "500"]
    environment:
      NODE_OPTIONS: --max-old-space-size=32768
      name: amazon-pdp
  amazon-plp:
    image: amazon-scraper
    build: .
    restart: unless-stopped
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["-c", "1000", "-l", "100", "-r", "5", "-t", "plp"]
    environment:
      NODE_OPTIONS: --max-old-space-size=8192
      name: amazon-plp
