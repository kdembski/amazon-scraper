x-pdp: &pdp
  image: amazon-scraper
  build: .
  restart: unless-stopped
  env_file: .env
  volumes:
    - ./free-proxies.txt:/app/free-proxies.txt:ro
  command: ["-c", "5000", "-l", "10000"]
  environment: &pdp-env
    NODE_OPTIONS: --max-old-space-size=32768

services:
  pdp-1:
    <<: *pdp
    environment:
      <<: *pdp-env
      name: pdp-1
  pdp-2:
    <<: *pdp
    environment:
      <<: *pdp-env
      name: pdp-2
  pdp-3:
    <<: *pdp
    environment:
      <<: *pdp-env
      name: pdp-3
  plp-1:
    image: amazon-scraper
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./free-proxies.txt:/app/free-proxies.txt:ro
    command: ["-c", "1000", "-l", "500", "-t", "plp"]
    environment:
      NODE_OPTIONS: --max-old-space-size=8192
      name: plp-1
